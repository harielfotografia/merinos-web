# ==========================================================
# Config Nginx usada DENTRO del contenedor Docker (Coolify).
# Distinta de nginx-merinos.conf (esa es para instalar Nginx
# directo en el VPS sin Docker). Coolify se encarga de HTTPS
# y del proxy hacia el puerto 80 de este contenedor.
# ==========================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* \.(?:css|js|svg|jpg|jpeg|png|webp|gif|ico|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
