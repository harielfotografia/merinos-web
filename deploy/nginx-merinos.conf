# ==========================================================
# Configuración Nginx para merinos web (landing page estática)
#
# INSTALACIÓN EN EL VPS:
#   1. Sube este archivo a:  /etc/nginx/sites-available/merinos
#   2. Crea el enlace:       sudo ln -s /etc/nginx/sites-available/merinos /etc/nginx/sites-enabled/
#   3. Prueba la config:     sudo nginx -t
#   4. Recarga Nginx:        sudo systemctl reload nginx
#
# Ajusta "root" abajo a la ruta real donde subiste los archivos del sitio.
# ==========================================================

server {
    listen 80;
    listen [::]:80;

    # Sin dominio todavía: "_" hace que este bloque responda
    # a cualquier request que llegue por IP.
    # Cuando tengas dominio, reemplaza por: server_name tudominio.cl www.tudominio.cl;
    server_name _;

    root /var/www/merinos;
    index index.html;

    # ---- Logs ----
    access_log /var/log/nginx/merinos.access.log;
    error_log  /var/log/nginx/merinos.error.log;

    # ---- Compresión ----
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- Cabeceras de seguridad básicas ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Caché para estáticos ----
    location ~* \.(?:css|js|svg|jpg|jpeg|png|webp|gif|ico|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Oculta archivos ocultos (.git, .env, etc.)
    location ~ /\. {
        deny all;
    }
}

# ==========================================================
# Cuando tengas un dominio apuntando a este VPS:
#   1. Reemplaza "server_name _;" por tu dominio real.
#   2. Instala certbot y genera SSL gratis:
#        sudo apt install certbot python3-certbot-nginx
#        sudo certbot --nginx -d tudominio.cl -d www.tudominio.cl
#      Esto crea automáticamente el bloque HTTPS (puerto 443)
#      y redirige el tráfico HTTP -> HTTPS.
# ==========================================================
